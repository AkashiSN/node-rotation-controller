suite: PrometheusRule alert expressions (spec §4.2 / §5.4)
# Guards the per-NodePool correlation of NodeRotationStalledInWindow. With
# per-policy maintenanceWindows (§5.4) noderotation_window_active carries a
# nodepool label, so the rule must join window_active, candidates, and completions
# by nodepool — not the pre-#123 cluster-wide `on()` join against global sums,
# which would alert every active-window pool whenever any pool stalls.
templates:
  - templates/prometheusrule.yaml
tests:
  - it: StalledInWindow correlates window/candidates/completions per nodepool
    set:
      prometheusRule.enabled: true
    asserts:
      # guard the rule index this test pins its expr assertions to
      - equal:
          path: spec.groups[0].rules[2].alert
          value: NodeRotationStalledInWindow
      # Claims inside their escalated retryBackoff are NOT eligible, so
      # noderotation_candidates reads 0 while a pool's every candidate waits
      # (issue #303). Without the retry_count arm this alert stays silent through
      # exactly the incident it exists to catch.
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: 'and on\(nodepool\) \(noderotation_candidates > 0 or on\(nodepool\) noderotation_retry_count > 0\)'
      # A failed attempt is NOT progress. noderotation_completed_total counts
      # outcome=failure and outcome=expired as well, and a readyTimeout rollback
      # records a failure — so without the outcome="success" selector every
      # failed attempt satisfies the `unless` arm and suppresses this alert
      # through exactly the window it exists to catch (issue #303).
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: 'unless on\(nodepool\) \(sum by\(nodepool\) \(increase\(noderotation_completed_total\{outcome="success"\}'
      # the old cluster-wide form must be gone
      - notMatchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: 'on\(\) \(sum\(noderotation_candidates\)'
  - it: WindowMissed alerts on the lost-window counter
    set:
      prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[7].alert
          value: NodeRotationWindowMissed
      - matchRegex:
          path: spec.groups[0].rules[7].expr
          pattern: 'increase\(noderotation_window_missed_total\[24h\]\) > 0'
      - equal:
          path: spec.groups[0].rules[7].labels.severity
          value: warning
  - it: ships eight alerts
    set:
      prometheusRule.enabled: true
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 8
