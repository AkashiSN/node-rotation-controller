{{- if .Values.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "node-rotation-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-rotation-controller.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: node-rotation-controller
      rules:
        # A rotation finished as failure or expired in the last hour. `expired`
        # means the old NodeClaim was force-expired before a graceful rotation
        # completed — the controller lost the lead-time race (spec §4.2, §3.5).
        - alert: NodeRotationCompletedFailureOrExpired
          expr: increase(noderotation_completed_total{outcome=~"failure|expired"}[1h]) > 0
          for: {{ .Values.prometheusRule.completedFailure.for }}
          labels:
            severity: {{ .Values.prometheusRule.completedFailure.severity }}
          annotations:
            summary: node-rotation-controller saw a failed or expired rotation
            description: >-
              {{`{{ $value }}`}} rotation(s) on NodePool {{`{{ $labels.nodepool }}`}}
              finished as {{`{{ $labels.outcome }}`}} in the last hour. See the
              production runbook (docs/runbook.md).
        # Candidates have been backing up across two consecutive windows: the
        # controller is falling behind (spec §4.2, R2). `windowRange` should be
        # set to two window periods (2·P) for your schedule. The `offset` guard
        # requires the series to have already been non-zero a full `windowRange`
        # ago, so a freshly created (e.g. just-restarted) non-zero candidates
        # series cannot alert before two windows of history actually exist.
        - alert: NodeRotationCandidatesNotDraining
          expr: |-
            min_over_time(noderotation_candidates[{{ .Values.prometheusRule.candidatesNotDraining.windowRange }}]) > 0
            and noderotation_candidates offset {{ .Values.prometheusRule.candidatesNotDraining.windowRange }} > 0
          for: {{ .Values.prometheusRule.candidatesNotDraining.for }}
          labels:
            severity: {{ .Values.prometheusRule.candidatesNotDraining.severity }}
          annotations:
            summary: node-rotation-controller candidates are not draining
            description: >-
              NodePool {{`{{ $labels.nodepool }}`}} has had eligible candidates
              for two consecutive windows without clearing them — rotation
              throughput may be too low (spec §4.2, R2). See docs/runbook.md.
        # A pool's window is active with candidates outstanding but nothing is
        # completing for that pool: rotation is wedged inside the window
        # (spec §4.2).
        # Correlated per NodePool, because maintenanceWindows is now per-policy and
        # noderotation_window_active carries a nodepool label (spec §5.4): each pool
        # is judged against its OWN candidates and completions, not a cluster-wide sum.
        # The in_backoff arm is load-bearing: a claim inside its escalated
        # retryBackoff is not eligible, so noderotation_candidates falls to 0
        # while the pool still has work outstanding (issue #303). Without it this
        # alert is silent through a window spent entirely on failed attempts.
        # candidates + in_backoff is exactly decide.Outstanding, the predicate
        # noderotation_window_missed_total judges the closed occurrence by, so the
        # in-window warning and the post-hoc counter name one condition (#321).
        # The outcome="success" selector on the suppression arm is load-bearing
        # for the same incident: noderotation_completed_total counts failure and
        # expired too, and a readyTimeout rollback records a failure — so an
        # unselected `unless` arm turns every failed attempt into "progress" and
        # suppresses the alert exactly when it is needed. The condition is "the
        # window is open, work is outstanding, and nothing is SUCCEEDING".
        # The freeze arm declines what the operator declined: a freeze stops
        # rotation on purpose, so a window spent under one was not lost, and
        # WindowEdge settles it without counting. freeze_until_timestamp is 0 when
        # no freeze is set and 0 > time() is false, so unfrozen pools are
        # unaffected (issue #321).
        - alert: NodeRotationStalledInWindow
          expr: |-
            noderotation_window_active == 1
            and on(nodepool) (noderotation_candidates > 0 or on(nodepool) noderotation_in_backoff > 0)
            unless on(nodepool) (sum by(nodepool) (increase(noderotation_completed_total{outcome="success"}[{{ .Values.prometheusRule.stalledInWindow.completionRange }}])) > 0)
            unless on(nodepool) (noderotation_freeze_until_timestamp > time())
          for: {{ .Values.prometheusRule.stalledInWindow.for }}
          labels:
            severity: {{ .Values.prometheusRule.stalledInWindow.severity }}
          annotations:
            summary: node-rotation-controller window active with no successful completions
            description: >-
              NodePool {{`{{ $labels.nodepool }}`}} has its maintenance window active
              and unfrozen, with NodeClaims eligible or waiting out a retryBackoff,
              but zero SUCCESSFUL completions for
              {{ .Values.prometheusRule.stalledInWindow.for }} — rotation appears
              wedged (spec §4.2). See docs/runbook.md.
        # The in-flight drain has exceeded tGP + buffer: a blocking PDB or a
        # stuck finalizer is holding it (spec §5.2). The serial gate is held on
        # purpose, so no other node in the pool rotates until this clears.
        - alert: NodeRotationDrainStuck
          expr: noderotation_drain_stuck == 1
          for: {{ .Values.prometheusRule.drainStuck.for }}
          labels:
            severity: {{ .Values.prometheusRule.drainStuck.severity }}
          annotations:
            summary: node-rotation-controller drain is stuck
            description: >-
              The in-flight drain on NodePool {{`{{ $labels.nodepool }}`}} has
              exceeded tGP + buffer — resolve the blocking PDB or stuck finalizer
              (spec §5.2). See docs/runbook.md.
        # NodeClaims whose own stamped expireAfter can no longer guarantee K
        # rotation chances (spec §3.2 layer 3). They are rotated best-effort but
        # may reach Forceful Expiration.
        - alert: NodeRotationShortLeadNodes
          expr: noderotation_short_lead_nodes > 0
          for: {{ .Values.prometheusRule.shortLeadNodes.for }}
          labels:
            severity: {{ .Values.prometheusRule.shortLeadNodes.severity }}
          annotations:
            summary: node-rotation-controller has short-lead NodeClaims
            description: >-
              {{`{{ $value }}`}} NodeClaim(s) on NodePool {{`{{ $labels.nodepool }}`}}
              can no longer be guaranteed K rotation chances before expireAfter
              (spec §3.2 layer 3). See docs/runbook.md.
        # The same rotation keeps failing (retry-count >= 3): a systematic cause
        # such as sustained placeholder preemption or a same-AZ capacity shortage
        # (spec §5.3, R3).
        - alert: NodeRotationRetryCountHigh
          expr: noderotation_retry_count >= 3
          for: {{ .Values.prometheusRule.retryCountHigh.for }}
          labels:
            severity: {{ .Values.prometheusRule.retryCountHigh.severity }}
          annotations:
            summary: node-rotation-controller retries are escalating
            description: >-
              A rotation on NodePool {{`{{ $labels.nodepool }}`}} has retried
              {{`{{ $value }}`}} times — a systematic cause such as sustained
              placeholder preemption or a same-AZ capacity shortage (spec §5.3,
              R3). See docs/runbook.md.
        # A window-bounded forceful fallback (ADR-0001) fired: a candidate that
        # could not finish a graceful surge before its own deadline was rotated
        # surge-less (spec §3.3). Per ADR-0001 a *single* fallback is the designed
        # outcome for a synchronized batch too large to rotate gracefully, so this
        # is an info-level visibility signal, not a page. Tighten it for your
        # environment (e.g. a sustained rate at `warning`).
        - alert: NodeRotationForcefulFallback
          expr: increase(noderotation_forceful_fallback_total[1h]) > 0
          for: {{ .Values.prometheusRule.forcefulFallback.for }}
          labels:
            severity: {{ .Values.prometheusRule.forcefulFallback.severity }}
          annotations:
            summary: node-rotation-controller performed a forceful fallback
            description: >-
              {{`{{ $value }}`}} window-bounded forceful fallback(s) on NodePool
              {{`{{ $labels.nodepool }}`}} in the last hour — graceful surges are
              losing the race to the deadline (spec §3.3, ADR-0001). See
              docs/runbook.md.
        # A maintenance window occurrence closed with candidates still outstanding
        # by age and state, and no rotation attributable to that occurrence ever
        # completed — even after allowing an in-flight attempt to finish past the
        # boundary, there still was none. The guaranteed rotation chance was
        # consumed and lost, and with minRotationChances: 1 no guaranteed graceful
        # chance remains for those nodes: they may now reach expireAfter without
        # one (spec §4.2). This is the post-hoc fact; NodeRotationStalledInWindow
        # is the in-window early warning for the same failure.
        - alert: NodeRotationWindowMissed
          expr: increase(noderotation_window_missed_total[{{ .Values.prometheusRule.windowMissed.range }}]) > 0
          for: {{ .Values.prometheusRule.windowMissed.for }}
          labels:
            severity: {{ .Values.prometheusRule.windowMissed.severity }}
          annotations:
            summary: node-rotation-controller lost a maintenance window
            description: >-
              NodePool {{`{{ $labels.nodepool }}`}} had a maintenance window close
              with candidates unrotated and no rotation attributable to that
              occurrence ever completing — the guaranteed rotation chance was
              consumed (spec §4.2). See docs/runbook.md.
{{- end }}
